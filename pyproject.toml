[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buzzracer"
version = "0.1.0"
description = "BuzzRacer Project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Nick Zhang", email = "nickzhang@gatech.edu"}
]
dependencies = [
    "cvxopt==1.3.2",
    "cvxpy==1.7.2",
    "deprecated>=1.3.1",
    "gpytorch~=1.14",
    "gymnasium==1.2.0",
    "inputs==0.5",
    "matplotlib>=3.5.1",
    "moderngl~=5.12.0",
    "moderngl-window~=3.1.1",
    "mosek==11.0.28",
    "numpy==2.2.6",
    "opencv-python~=4.12.0.88",
    "pandas==2.3.2",
    "pillow==11.3.0",
    "progressbar33==2.4",
    "pygame==2.6.1",
    "pyserial==3.5",
    "pyttsx3==2.99",
    "scipy~=1.16.0",
    "seaborn==0.13.2",
    "sympy==1.14.0",
    "torch==2.8.0",
]

[tool.setuptools.packages.find]
# This tells Python: "Only look in the 'buzzracer' folder for code"
include = ["buzzracer*"] 
exclude = ["log*", "gifs*", "docs*","log*"]
